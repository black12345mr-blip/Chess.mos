<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Chess - Click to Move</title>
    <!-- Tailwind CSS สำหรับตกแต่ง UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- CSS ของ chessboard.js -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        .highlight-selected {
            background-color: rgba(255, 255, 0, 0.4) !important;
        }
        .highlight-legal {
            box-shadow: inset 0 0 0 3px rgba(0, 128, 0, 0.6);
        }
        body {
            background-color: #161512;
            color: #bababa;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between select-none">

    <!-- Header -->
    <header class="py-4 px-8 border-b border-gray-800 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-2xl font-bold text-green-500">♟️ ChessPro</span>
            <span class="text-xs bg-gray-800 text-gray-300 px-2 py-1 rounded">Click-to-Move Mode</span>
        </div>
        <div id="top-turn" class="bg-gray-800 text-white px-4 py-1.5 rounded-full text-sm font-medium">
            ตาฝ่ายขาวเริ่มก่อน (White to Move)
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col lg:flex-row items-center justify-center p-4 gap-8">
        
        <!-- กระดานหมากรุก -->
        <div class="bg-[#262421] p-3 rounded-lg shadow-2xl border border-gray-800">
            <div id="board" style="width: 420px;" class="rounded overflow-hidden shadow-inner cursor-pointer"></div>
        </div>

        <!-- แผงข้าง (Side Panel) -->
        <div class="w-full lg:w-80 bg-[#262421] border border-gray-800 rounded-lg flex flex-col h-[420px] shadow-2xl">
            <div class="p-4 border-b border-gray-800 font-semibold text-white flex justify-between items-center">
                <span>ประวัติการเดิน (Move History)</span>
                <span id="move-count" class="text-xs text-gray-400">0 ตา</span>
            </div>
            
            <div id="move-history" class="flex-1 p-4 overflow-y-auto space-y-1 font-mono text-sm text-gray-300">
                <div class="text-gray-500 italic text-center mt-20">ยังไม่มีการเดินหมาก...</div>
            </div>

            <div class="p-4 border-t border-gray-800 bg-[#1e1d1a] flex gap-2">
                <button id="resetBtn" class="flex-1 bg-[#363532] hover:bg-[#454340] text-white py-2 rounded font-medium transition text-sm">
                    เริ่มเกมใหม่
                </button>
                <button id="undoBtn" class="flex-1 bg-[#363532] hover:bg-[#454340] text-white py-2 rounded font-medium transition text-sm">
                    ย้อนกลับ
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="py-3 text-center text-xs text-gray-600 border-t border-gray-800">
        HTML5 Chess Game with Click-to-Move System
    </footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var selectedSquare = null;
        var legalMoves = [];

        // เสียงเอฟเฟกต์เดินหมาก
        function playMoveSound(isCapture) {
            var ctx = new (window.AudioContext || window.webkitAudioContext)();
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = isCapture ? 300 : 440;
            gain.gain.setValueAtTime(0.1, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        }

        // ล้างไฮไลต์ทั้งหมดบนกระดาน
        function removeHighlights () {
            $('#board .square-55d63').removeClass('highlight-selected highlight-legal');
        }

        // เพิ่มไฮไลต์ช่องที่เลือกและช่องที่เดินได้
        function addHighlights (square) {
            $('#board .square-' + square).addClass('highlight-selected');
            legalMoves.forEach(function(move) {
                $('#board .square-' + move.to).addClass('highlight-legal');
            });
        }

        // ระบบคลิกช่องบนกระดาน
        function onSquareClick (square) {
            if (game.game_over()) return;

            // ถ้ายังไม่ได้เลือกหมาก
            if (!selectedSquare) {
                var piece = game.get(square);
                // เช็คว่าเป็นหมากของเราเองหรือไม่
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    // ดึงรายการตาเดินที่เป็นไปได้ทั้งหมดของหมากตัวนี้
                    legalMoves = game.moves({ square: square, verbose: true });
                    addHighlights(square);
                }
            } 
            // ถ้าเลือกหมากไว้แล้ว และคลิกช่องเดิม (เป็นการยกเลิกการเลือก)
            else if (selectedSquare === square) {
                removeHighlights();
                selectedSquare = null;
                legalMoves = [];
            } 
            // ถ้าเลือกช่องอื่นเพื่อเดินไป
            else {
                var matchMove = legalMoves.find(m => m.to === square);
                
                if (matchMove) {
                    var targetPiece = game.get(square);
                    var isCapture = targetPiece !== null;

                    game.move({
                        from: selectedSquare,
                        to: square,
                        promotion: 'q'
                    });

                    playMoveSound(isCapture);
                    board.position(game.fen());
                    
                    removeHighlights();
                    selectedSquare = null;
                    legalMoves = [];
                    updateUI();
                } else {
                    // ถ้าคลิกเปลี่ยนไปเลือกหมากตัวอื่นของตัวเองแทน
                    removeHighlights();
                    selectedSquare = null;
                    legalMoves = [];

                    var piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                        legalMoves = game.moves({ square: square, verbose: true });
                        addHighlights(square);
                    }
                }
            }
        }

        // อัปเดตสถานะ UI และประวัติการเดิน
        function updateUI () {
            var turnText = game.turn() === 'w' ? 'ตาฝ่ายขาว (White turn)' : 'ตาฝ่ายดำ (Black turn)';
            
            if (game.in_checkmate()) {
                turnText = '🔥 รุกฆาต! ' + (game.turn() === 'w' ? 'ฝ่ายดำชนะ!' : 'ฝ่ายขาวชนะ!');
            } else if (game.in_draw()) {
                turnText = '🤝 เกมเสมอ (Draw)';
            } else if (game.in_check()) {
                turnText += ' ⚠️ (กำลังถูกรุก!)';
            }

            $('#top-turn').text(turnText);

            var history = game.history({ verbose: true });
            var historyHtml = '';
            
            $('#move-count').text(history.length + ' ตา');

            if (history.length === 0) {
                $('#move-history').html('<div class="text-gray-500 italic text-center mt-20">ยังไม่มีการเดินหมาก...</div>');
                return;
            }

            for (var i = 0; i < history.length; i += 2) {
                var whiteMove = history[i] ? history[i].san : '';
                var blackMove = history[i+1] ? history[i+1].san : '';
                var index = (i / 2) + 1;
                
                historyHtml += `<div class="flex py-1 px-2 hover:bg-[#32302c] rounded">
                    <span class="w-10 text-gray-500">${index}.</span>
                    <span class="w-28 text-white font-semibold">${whiteMove}</span>
                    <span class="w-28 text-gray-300 font-semibold">${blackMove}</span>
                </div>`;
            }
            
            var $historyDiv = $('#move-history');
            $historyDiv.html(historyHtml);
            $historyDiv.scrollTop($historyDiv[0].scrollHeight);
        }

        var config = {
            draggable: false, // ปิดการลาก (Drag & Drop) เพื่อใช้งานระบบคลิกอย่างเดียว
            position: 'start',
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        };

        board = Chessboard('board', config);

        // ดักจับอีเวนต์การคลิกบนช่องตารางหมากรุก
        $('#board').on('click', '.square-55d63', function() {
            var square = $(this).data('square');
            onSquareClick(square);
        });

        // ปุ่มเริ่มเกมใหม่
        $('#resetBtn').on('click', function () {
            game.reset();
            board.start();
            removeHighlights();
            selectedSquare = null;
            legalMoves = [];
            updateUI();
        });

        // ปุ่มย้อนกลับการเดิน (Undo)
        $('#undoBtn').on('click', function () {
            game.undo();
            game.undo();
            board.position(game.fen());
            removeHighlights();
            selectedSquare = null;
            legalMoves = [];
            updateUI();
        });

        updateUI();
    </script>
</body>
</html>
